name: Feature request
description: 提出新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        大功能或布局调整建议先在这里讨论方案与取舍，再开始实现。
        与本机凭据、邮件或第三方服务相关的功能，请说明数据来源、权限与失败时的显示方式。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 现在遇到什么不便？谁会在什么情况下使用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述交互、界面或数据上的期望结果，不必写实现细节。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的替代做法，以及为什么不够好。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      multiple: true
      options:
        - 灵动岛窗口/布局
        - 设置窗口
        - 计时器/番茄钟
        - 喝水/统计
        - 音乐/歌词
        - 邮件
        - AI 额度
        - 系统状态/音频设备
        - 开机启动/托盘
        - 安装/更新
        - 文档/开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 数据、隐私或兼容性影响
      description: 是否访问新的网络服务、本机数据或凭据？在接口失败时应如何显示？
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 与路线图，未发现重复。
          required: true
