[package]
name = "dynamic-island"
version = "0.1.0"
description = "A Windows dynamic island for timers, water, media, mail codes, AI quota and audio devices"
authors = ["dkj"]
license = "MIT"
repository = "https://github.com/dkj-duan/dynamic-Island"
homepage = "https://github.com/dkj-duan/dynamic-Island#readme"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.16"
regex = "1"
uuid = { version = "1", features = ["v4"] }
arboard = { version = "3", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2"
tempfile = "3"
zeroize = "1"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
webview2-com = "0.39"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-single-instance = "2"
wmi = "0.18"
windows-collections = "0.3"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_LibraryLoader"] }
windows = { version = "0.62", features = ["Media_Control", "Storage_Streams", "Devices_Bluetooth", "Devices_Enumeration", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
